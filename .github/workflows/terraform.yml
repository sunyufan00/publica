name: Ultra Light Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          # 1. 获取原库文件列表
          curl -s https://api.github.com/repos/qwe213312/k25FCdfEOoEJ42S6/git/trees/main?recursive=1 | jq -r '.tree[].path' | grep manifest > /tmp/source

          # 2. 获取你现有文件
          curl -s https://api.github.com/repos/sunyufan00/publica/git/trees/main?recursive=1 | jq -r '.tree[].path' | grep manifest > /tmp/target 2>/dev/null

          # 3. 找出你没有的新文件
          grep -Fxvf /tmp/target /tmp/source | head -20 > /tmp/todo

          # 4. 逐个上传（极简，永不报错）
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            content=$(curl -s "https://raw.githubusercontent.com/qwe213312/k25FCdfEOoEJ42S6/main/$f" | base64 -w 0)
            curl -s -X PUT "https://api.github.com/repos/sunyufan00/publica/contents/$f" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -d '{"message":"add","content":"'"$content"'"}'
            sleep 1
          done < /tmp/todo
