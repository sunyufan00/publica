name: 云端API同步（永不爆盘）
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: 安装依赖
        run: |
          apk add --no-cache curl jq git
        
      - name: 获取原库新文件列表
        run: |
          curl -s https://api.github.com/repos/qwe213312/k25FCdfEOoEJ42S6/git/trees/main?recursive=1 | jq -r '.tree[].path' > /tmp/all_files
          
      - name: 批量下载新文件（不写入Git，不占空间）
        run: |
          mkdir -p /tmp/new_files
          while read f; do
            if [[ "$f" == *.manifest ]]; then
              curl -s -o "/tmp/new_files/$f" "https://raw.githubusercontent.com/qwe213312/k25FCdfEOoEJ42S6/main/$f"
            fi
          done < /tmp/all_files
          
      - name: 直接通过API上传到你的仓库（永不checkout！）
        run: |
          cd /tmp/new_files
          for file in *.manifest; do
            content=$(base64 -w0 "$file")
            curl -s -X PUT "https://api.github.com/repos/sunyufan00/publica/contents/$file" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{\"message\":\"自动同步新增文件\",\"content\":\"$content\"}"
          done
