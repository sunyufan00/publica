name: 超轻量实时同步（永不爆盘）
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟自动同步一次！

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 仅同步最新文件（无历史，超小体积）
        run: |
          # 克隆你自己的仓库（只最新版）
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sunyufan00/publica.git myrepo
          cd myrepo
          
          # 直接覆盖下载原库最新文件
          curl -L https://github.com/qwe213312/k25FCdfEOoEJ42S6/archive/refs/heads/main.zip -o upstream.zip
          unzip -o upstream.zip -d temp
          cp -rf temp/k25FCdfEOoEJ42S6-main/* .
          rm -rf temp upstream.zip
          
          # 提交并推送
          git config --global user.name "sync"
          git config --global user.email "sync@github.com"
          git add .
          git commit -m "自动同步原库更新" || true
          git push --force origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
